# map 서비스 스택 컨테이너 오케스트레이션 정의 파일.
#
# project name: map-project (컨테이너·네트워크·볼륨 prefix 로 사용된다)
#
# 스택 분리:
#   서비스 스택(이 파일)  — 사용자 트래픽을 받는 서비스와 그 저장소.
#   관리자 스택(docker-compose.admin.yml) — 운영 콘솔과 모니터링.
#   두 스택은 map-net 네트워크를 공유한다. 이 파일이 네트워크의 소유자이므로
#   기동은 서비스 → 관리자, 종료는 관리자 → 서비스 순서로 한다.
#
# 프로파일 구성:
#   infra   — 인프라 컨테이너만 (postgres / redis)
#   backend — 애플리케이션 컨테이너 (user / agent / hub / proxy)
#   full    — 위 둘 전부 (infra + backend)
#   vision  — 카메라 인식 서비스 (yolo). full 에 포함되지 않는 별도 프로파일이다.
#             이미지에 torch 가 들어가 무겁고 카메라 기능을 쓸 때만 필요하다.
#   routing — 경로 라우팅 엔진 (osrm-foot / osrm-bicycle). full 에 포함되지 않는
#             별도 프로파일이다. OSRM 데이터(scripts/osrm-rebuild.sh)를 빌드한
#             뒤에만 기동한다. hub 는 이 서비스에 depends_on 을 걸지 않으며,
#             미기동/미설정 시 실제 경로를 만들 수 없다는 오류를 반환한다.
#   프로파일에 속하지 않는 서비스는 `docker compose up` 시 기동되지 않는다.
#
# 환경 변수:
#   --env-file로 선택한 파일에서 각 서비스의 명시된 허용 변수만 주입한다.
#   postgres 의 POSTGRES_* 변수는 동일한 .env 에서 치환된다.
#
# 컨테이너 이름은 map-project-<서비스명> 으로 고정한다. 자동 생성 이름
# (map-hub-1 처럼 프로젝트명과 일련번호가 붙는 형태)은 어느 스택 소속인지
# 한눈에 들어오지 않는다. 이름을 고정하면 --scale 을 쓸 수 없는데,
# 이 스택은 수평 확장을 하지 않으므로 문제가 되지 않는다.
#
# 네트워크: 모든 서비스는 map-net 단일 브리지 네트워크에 연결된다.
# 포트는 보안상 127.0.0.1 루프백에만 바인딩한다.

name: map-project

# 서비스별 environment 허용목록으로 비밀값 전달 범위를 제한한다.
# 값 없는 YAML 항목은 선택한 --env-file/실행 환경에 있을 때만 전달된다.
# 로그가 무한히 쌓이지 않게 한다.
#
# 기본값은 크기 제한이 없다. 상태 확인만으로도 서비스마다 하루 수만 줄이
# 쌓이는데, 그것이 디스크를 채우면 저장소가 먼저 죽는다. 그때 드러나는 모습은
# "갑자기 아무것도 안 된다" 이고, 원인이 로그라는 것은 한참 뒤에야 보인다.
#
# 세 벌까지 남긴다. 되짚기에는 충분하고 서비스마다 30MB 를 넘지 않는다.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 빈 데이터 볼륨에서 DB 를 준비하는 psql 단계의 공통 틀(db/setup/setup.sh).
# 서비스가 아니라 끝나면 멈추는 작업이다. 모든 단계는 다시 돌려도 안전해서 두 번째
# up 부터는 할 일 없이 지나간다. 역할 SQL 은 형제 레포의 것을 읽기 전용으로 붙인다.
x-db-setup: &db-setup
  image: postgis/postgis:17-3.5
  platform: linux/amd64
  profiles: ["backend", "full"]
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  entrypoint: ["bash", "/setup/setup.sh"]
  environment:
    MAP_PROJECT_POSTGRES_DB:
    MAP_PROJECT_POSTGRES_USER:
    MAP_PROJECT_POSTGRES_PASSWORD:
    MAP_PROJECT_ADMIN_DB_PASSWORD:
    USER_BOOTSTRAP_MARKER:
    USER_BOOTSTRAP_PASSWORD:
    USER_DATABASE_PASSWORD:
    USER_MIGRATION_PASSWORD:
    HUB_DATABASE_URL:
    HUB_MIGRATION_DATABASE_URL:
    AGENT_DATABASE_PASSWORD:
    AGENT_CHECKPOINT_MIGRATION_DSN:
    MAP_PROJECT_POSTGRES_EXPORTER_DSN:
  volumes:
    - ./db/setup:/setup:ro
    - ../map-project-user/scripts/sql:/sql/user:ro
    - ../map-project-hub/scripts/database-roles.sql:/sql/hub/database-roles.sql:ro
    - ../map-project-agent/scripts/database-roles.sql:/sql/agent/database-roles.sql:ro
    - db-setup-state:/state

services:
  # ── 빈 DB 준비 사슬(위에서 아래 순서, 각 단계는 앞 단계가 성공으로 끝나야 시작) ──
  # user 는 빈 DB 에서만 부트스트랩하고(psql 준비 → user 이미지 부트스트랩 → psql 활성화 →
  # user 이미지 마이그레이션), 그 뒤에 PostGIS·나머지 스키마·hub/agent/admin 역할을 만든다.
  # hub 의 첫 마이그레이션은 잠시 받은 권한으로 돌고, 마지막 단계가 그 권한을 거둔다.
  db-user-prepare:
    <<: [*default-logging, *db-setup]
    command: ["user-prepare"]
    depends_on:
      postgres:
        condition: service_healthy

  user-db-bootstrap:
    <<: *default-logging
    build:
      context: ../map-project-user
    profiles: ["backend", "full"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 준비 단계가 이번에 새로 연 경우에만 돈다. 이미 끝난 DB 에서 다시 돌면 거절되기 때문이다.
    entrypoint: ["sh", "-c", "[ -f /state/user-bootstrap.pending ] || { echo 'user 부트스트랩: 이미 끝남 — 건너뜀'; exit 0; }; exec java -Xmx192m -Dloader.main=map.bootstrap.UserBootstrapApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher bootstrap"]
    environment:
      USER_BOOTSTRAP_URL: jdbc:postgresql://postgres:5432/${MAP_PROJECT_POSTGRES_DB}
      USER_BOOTSTRAP_USERNAME: map_user_bootstrap
      USER_BOOTSTRAP_EXPECTED_DATABASE: ${MAP_PROJECT_POSTGRES_DB}
      USER_BOOTSTRAP_PASSWORD:
      USER_BOOTSTRAP_MARKER:
    volumes:
      - db-setup-state:/state:ro
    depends_on:
      db-user-prepare:
        condition: service_completed_successfully

  db-user-activate:
    <<: [*default-logging, *db-setup]
    command: ["user-activate"]
    depends_on:
      user-db-bootstrap:
        condition: service_completed_successfully

  user-db-migrate:
    <<: *default-logging
    build:
      context: ../map-project-user
    profiles: ["backend", "full"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: ["java", "-Xmx256m", "-Dloader.main=map.migration.UserMigrationApplication", "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher", "migrate"]
    environment:
      USER_MIGRATION_URL:
      USER_MIGRATION_USERNAME:
      USER_MIGRATION_PASSWORD:
    depends_on:
      db-user-activate:
        condition: service_completed_successfully

  db-platform:
    <<: [*default-logging, *db-setup]
    command: ["platform"]
    depends_on:
      user-db-migrate:
        condition: service_completed_successfully

  hub-db-migrate:
    <<: *default-logging
    build:
      context: ../map-project-hub
    profiles: ["backend", "full"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 마이그레이션 자격 하나만 준다. 서빙 자격이 함께 있으면 hub 가 실행을 거부한다.
    entrypoint: ["python", "-m", "map_project_hub.db.migrate"]
    environment:
      HUB_MIGRATION_DATABASE_URL:
    depends_on:
      db-platform:
        condition: service_completed_successfully

  db-finish:
    <<: [*default-logging, *db-setup]
    command: ["finish"]
    depends_on:
      hub-db-migrate:
        condition: service_completed_successfully

  # postgres — PostGIS 확장이 포함된 메인 RDB.
  # 첫 부팅에는 아무 SQL 도 돌리지 않는다. user 의 빈 DB 부트스트랩이 확장도 스키마도
  # 없는 DB 를 요구하므로, 스키마·역할·확장은 아래 db-* 일회성 단계가 순서대로 만든다.
  # ports: 호스트 5432 (루프백) → 컨테이너 5432
  postgres:
    <<: *default-logging
    image: postgis/postgis:17-3.5
    container_name: map-project-postgres
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    restart: unless-stopped
    # 유휴 약 220MiB. 공유버퍼와 PostGIS 인덱스가 커질 여지를 두고 1g.
    # postgis/postgis 는 amd64 전용이다(arm64 매니페스트 없음 — 17-3.5 ·
    # 17-3.5-alpine 모두 동일, manifest 실측 2026-07-29). platform 을 명시하지
    # 않으면 arm64 호스트(Apple Silicon)의 이미지 캐시가 없는 새 환경에서
    # `no matching manifest for linux/arm64/v8` 로 pull 이 실패하고, postgres 에
    # depends_on 을 건 user/agent/hub 까지 전부 기동 불가가 된다.
    platform: linux/amd64
    profiles: ["infra", "full"]
    environment:
      POSTGRES_DB: ${MAP_PROJECT_POSTGRES_DB}
      POSTGRES_USER: ${MAP_PROJECT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MAP_PROJECT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 이미지가 가진 첫 부팅 스크립트(PostGIS·topology·tiger 를 깔아 둔다)를 빈 자리로
    # 덮는다. 그 스크립트가 돌면 user 의 빈 DB 부트스트랩이 거절된다. PostGIS 는
    # db-platform 단계가 필요한 것만 public 에 깐다.
    tmpfs:
      - /docker-entrypoint-initdb.d
    healthcheck:
      # -h 를 준다. 빼면 초기화 중에 잠깐 뜨는 내부 서버에도 응답이 와서,
      # 아직 받을 수 없는 상태를 준비됐다고 읽는다. 빈 볼륨 첫 부팅에서만
      # 열리는 창이라 평소에는 드러나지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${MAP_PROJECT_POSTGRES_USER} -d ${MAP_PROJECT_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # redis — L1 캐시 / 단기 키-값 저장소.
  # appendonly 모드로 지속화하여 재기동 시 데이터를 유지한다.
  # ports: 호스트 16379 → 컨테이너 6379 (호스트 측 충돌 회피용 매핑)
  redis:
    <<: *default-logging
    image: redis:7-alpine
    container_name: map-project-redis
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    restart: unless-stopped
    # 캐시·카운터·스트림만 담고 데이터셋을 담지 않아 유휴 약 10MiB.
    profiles: ["infra", "full"]
    # REDIS_PASSWORD 가 비어 있으면(현행) 무인증으로 기동한다.
    # 값이 설정되면 명령줄이 아니라 표준입력(redis-server -)의 설정 한 줄로 인증을
    # 켠다. 명령줄의 값은 호스트의 모든 계정이 프로세스 목록으로 읽는다. 큰따옴표
    # 안에서는 \ 와 " 만 이스케이프하면 값이 그대로 읽힌다. exec 로 redis-server 가
    # PID 1 이 되어 종료 신호를 직접 받는다.
    # $$ 는 compose 치환이 아니라 컨테이너 shell 확장(런타임)을 의미한다.
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || exec redis-server --appendonly yes
        exec redis-server - --appendonly yes <<EOF
        requirepass "$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')"
        EOF
    # redis 는 x-app-env 앵커를 쓰지 않으므로 REDIS_PASSWORD 를 .env 에서 명시 주입.
    environment:
      - REDIS_PASSWORD=${MAP_PROJECT_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # redis-cli 는 REDISCLI_AUTH 환경변수로 인증한다. -a 로 주면 10초마다 값이
      # 명령줄(호스트 프로세스 목록)에 드러난다.
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  # osrm-foot — 도보 라우팅 엔진.
  # --mmap 1: 그래프를 통째로 읽어 올리지 않고 파일을 그대로 들여다본다.
  # 안 그러면 3.1G 짜리 그래프를 메모리에 펼치느라 아래 상한에 걸려 죽는다
  # (실측: 없이 = 1GiB 를 꽉 채우고 OOM, 붙이면 = 시작 70MiB, 30회 조회 후
  # 380MiB). 남는 부분은 커널이 알아서 버리므로 상한이 죽이는 선이 아니라
  # 눌러 두는 선으로 바뀐다. 경로 품질은 같다 — 같은 그래프를 읽는다.
  # scripts/osrm-rebuild.sh 로 만든 그래프를 named volume osrm-data 의 /foot/korea.osrm 로 넣어
  # 사전 빌드한 그래프를 read-only 로 마운트해 osrm-routed(MLD)로 서빙한다.
  # profiles: ["routing"] — full 에 포함되지 않는다. 데이터 빌드 후에만 기동.
  # ports: 호스트 5000 → 컨테이너 5000 (osrm-routed 기본 포트, 루프백 바인딩)
  osrm-foot:
    <<: *default-logging
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    container_name: map-project-osrm-foot
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped
    # --mmap 로 그래프를 파일 매핑해 읽으므로 상주 메모리가 상한보다 훨씬 작다.
    # osrm-backend 는 amd64 전용(arm64 미제공). arm64 호스트(Apple Silicon)는
    # 아래 platform 으로 amd64 에뮬레이션 실행된다. 프로덕션 amd64 서버는 네이티브.
    platform: linux/amd64
    profiles: ["routing"]
    environment:
      DISABLE_ACCESS_LOGGING: "1"
    command: ["osrm-routed", "--algorithm", "mld", "--mmap", "1", "--verbosity", "ERROR", "/data/foot/korea.osrm"]
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      # 뿌리 주소는 그래프를 읽지 않고도 답한다. 좌표를 도로에 붙여 보는 조회로
      # 물어야 포트만 열린 상태와 길을 낼 수 있는 상태가 갈린다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/nearest/v1/foot/126.9780,37.5665 | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 그래프를 여는 동안의 실패는 세지 않는다.
      start_period: 30s
    volumes:
      - osrm-data:/data:ro

  # osrm-bicycle — 자전거 라우팅 엔진.
  # foot 과 동일 빌드 절차의 /bicycle/korea.osrm 을 읽는다(같은 named volume 공유).
  # ports: 호스트 5001 → 컨테이너 5000 (foot 과 호스트 포트만 다르다)
  osrm-bicycle:
    <<: *default-logging
    image: ghcr.io/project-osrm/osrm-backend:v26.5.0-amd64-alpine
    container_name: map-project-osrm-bicycle
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped
    # foot 과 같은 방식으로 읽는다.
    platform: linux/amd64
    profiles: ["routing"]
    environment:
      DISABLE_ACCESS_LOGGING: "1"
    command: ["osrm-routed", "--algorithm", "mld", "--mmap", "1", "--verbosity", "ERROR", "/data/bicycle/korea.osrm"]
    ports:
      - "127.0.0.1:5001:5000"
    healthcheck:
      # 뿌리 주소는 그래프를 읽지 않고도 답한다. 좌표를 도로에 붙여 보는 조회로
      # 물어야 포트만 열린 상태와 길을 낼 수 있는 상태가 갈린다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/nearest/v1/bicycle/126.9780,37.5665 | grep -q '\"code\":\"Ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 그래프를 여는 동안의 실패는 세지 않는다.
      start_period: 30s
    volumes:
      - osrm-data:/data:ro

  # user — BFF(Backend For Frontend) 애플리케이션.
  # 인접 디렉터리(../map-project-user)의 Dockerfile 로 빌드된다.
  # postgres / redis 의 healthcheck 통과를 기다린 후 기동된다.
  # ports: 호스트 8080 → 컨테이너 8080 (actuator/health 헬스체크)
  user:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ../map-project-user
    container_name: map-project-user
    <<: *default-logging
    restart: unless-stopped
    # 유휴 약 670MiB. 상한을 걸면 JVM 이 힙을 상한 기준으로 다시 잡으므로
    # 아래 JAVA_TOOL_OPTIONS 로 비율을 함께 올린다. 둘 중 하나만 넣으면
    # 기본 비율 25%가 적용돼 힙이 512m 로 줄고 상한 이전보다 나빠진다.
    deploy:
      resources:
        limits:
          cpus: "2.0"  # 코어 수를 넘는 상한은 2코어 서버에서 생성이 거절된다
          memory: 2g
    environment:
      MAP_PROJECT_AGENT_BASE_URL:
      USER_AGENT_TIMEOUT_SECONDS:
      USER_APPLE_CLIENT_ID:
      USER_APPLE_ENABLED:
      USER_APPLE_KEY_ID:
      USER_APPLE_PRIVATE_KEY_B64:
      USER_APPLE_TEAM_ID:
      USER_APPLE_VALIDATION_DELAY_MS:
      USER_AUTH_ENFORCED:
      USER_CHAT_BROADCAST_CHANNEL:
      USER_CHAT_EXPIRY_GRACE_DAYS:
      USER_CHAT_EXPIRY_SWEEP_INTERVAL_MS:
      USER_CHAT_HISTORY_PAGE_SIZE:
      USER_CHAT_INVITE_BASE_URL:
      USER_CHAT_INVITE_PREVIEW_RATE_LIMIT:
      USER_CHAT_INVITE_PREVIEW_RATE_WINDOW_SECONDS:
      USER_CHAT_INVITE_RATE_LIMIT:
      USER_CHAT_INVITE_RATE_WINDOW_SECONDS:
      USER_CHAT_INVITE_TTL_DAYS:
      USER_CHAT_MAX_MESSAGE_LENGTH:
      USER_CHAT_MAX_PARTICIPANTS:
