      # 네이티브 버퍼 몫이다. 지정하지 않으면 기본 25%가 적용된다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-finish:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # agent — LLM/그래프 추론 애플리케이션.
  # postgres 와 hub 가 살아있는지 확인한 뒤 기동된다.
  # hub 는 service_started 만 보장(자체 health 의존성 없음).
  # ports: 호스트 8000 → 컨테이너 8000 (FastAPI /health)
  agent:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ../map-project-agent
    container_name: map-project-agent
    environment:
      AGENT_AUTH_ENFORCED:
      AGENT_CANDIDATES_MAX_BASE:
      AGENT_CANDIDATES_PER_DAY:
      AGENT_CHECKPOINT_ENABLED:
      AGENT_CHECKPOINT_ENC_ACTIVE_KID:
      AGENT_CHECKPOINT_ENC_KEYS:
      MAP_PROJECT_GEMINI_API_KEY:
      AGENT_GEMINI_HTTP_TIMEOUT_SECONDS:
      AGENT_GEMINI_MAX_CALLS_PER_REQUEST:
      AGENT_GEMINI_MAX_OUTPUT_TOKENS:
      MAP_PROJECT_GEMINI_MODEL:
      AGENT_GEMINI_RETRY_ATTEMPTS:
      AGENT_GEMINI_RETRY_INITIAL_DELAY:
      AGENT_GEMINI_RETRY_MAX_DELAY:
      AGENT_GEMINI_RETRY_STATUS_CODES:
      MAP_PROJECT_GEMINI_RPD_CAP:
      AGENT_GEMINI_RPD_LIMIT:
      AGENT_GEMINI_RPM_LIMIT:
      AGENT_GEMINI_TEMPERATURE:
      AGENT_GEMINI_THINKING_BUDGET:
      AGENT_GEMINI_TIMEOUT_SECONDS:
      MAP_PROJECT_HUB_BASE_URL:
      AGENT_HUB_TIMEOUT_SECONDS:
      MAP_PROJECT_INTERNAL_SERVICE_TOKEN:
      AGENT_JOB_TIMEOUT_SECONDS:
      AGENT_LLM_PROVIDER:
      AGENT_LANGGRAPH_SCHEMA:
      MAP_PROJECT_LOCATION_WIRE_KEY:
      AGENT_LOG_LEVEL:
      AGENT_PERSONALIZATION_ENABLED:
      MAP_PROJECT_POSTGRES_DB:
      MAP_PROJECT_POSTGRES_HOST:
      # Serving connects with its own restricted checkpoint login. The bare
      # POSTGRES_USER/POSTGRES_PASSWORD pair belongs to the database container's
      # operator, so inheriting it here would hand this service that account.
      AGENT_DATABASE_PASSWORD: ${AGENT_DATABASE_PASSWORD:?agent runtime database password required}
      MAP_PROJECT_POSTGRES_PORT:
      AGENT_DATABASE_USER: ${AGENT_DATABASE_USER:?agent runtime database role required}
      MAP_PROJECT_REDIS_DB_RATELIMIT:
      MAP_PROJECT_REDIS_DB_STREAMS:
      MAP_PROJECT_REDIS_URL:
      AGENT_REVIEWS_DISPLAY:
      AGENT_REVIEWS_ENRICH_ENABLED:
      AGENT_REVIEWS_FETCH_CAP_PER_JOB:
      AGENT_REVIEWS_MAX_PLACES:
      AGENT_RULES_ENABLED:
      AGENT_SEGMENT_STATS_PATH:
      AGENT_SHUTDOWN_GRACE_SECONDS:
      AGENT_STATUS_STREAM_MAXLEN:
      AGENT_STATUS_STREAM_NAME:
      MAP_PROJECT_STREAM_MAXLEN:
      MAP_PROJECT_STREAM_NAME:
      AGENT_SUMMARY_ENABLED:
      AGENT_SUMMARY_MAX_LLM_CALLS:
      AGENT_SUMMARY_MAX_PLACES:
      AGENT_TIMELINE_BUFFER_MINUTES:
      AGENT_TIMELINE_ENABLED:
      MAP_PROJECT_TRAINING_CAPTURE_ENABLED: ${MAP_PROJECT_TRAINING_CAPTURE_ENABLED:-false}
    <<: *default-logging
    restart: unless-stopped
    # 종료 신호를 받고 정리할 시간을 넉넉히 준다. 이 서비스는 진행 중인
    # 생성 작업을 기다렸다가 못 끝낸 것에 실패를 알리고 나가도록 되어
    # 있는데, 기본값 10초는 그 절차를 중간에 끊는다. 끊기면 기다리던
    # 쪽은 아무 통지도 못 받고 시간 초과까지 그대로 매달린다.
    # 할 일이 없으면 곧바로 나가므로 평소 배포가 느려지지는 않는다.
    stop_grace_period: 320s
    # 유휴 약 100MiB. 모델 호출은 원격이라 프로세스 안에 모델이 없다.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512m
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      hub:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 세어 둔 성향별 저장 비율. 자료가 쌓이면 다시 만들어 갈아 끼운다.
      # 없어도 그만이라 읽기 전용으로 붙이고, 못 읽으면 랭킹은 예전대로 돈다.
      - ./segstats:/app/segstats:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 저장소에 처음 붙는 동안의 실패는 세지 않는다.
      start_period: 20s

  # hub — 외부 데이터 게이트웨이 애플리케이션.
  # postgres / redis 가 살아있어야 기동된다.
  # 컨테이너 내부의 8000 포트를 호스트 8001 로 노출하여
  # agent / user 의 8000 / 8080 과 충돌하지 않게 한다.
  hub:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ../map-project-hub
    container_name: map-project-hub
    <<: *default-logging
    environment:
      HUB_AIRKOREA_CACHE_TTL_SEC:
      HUB_AIRKOREA_FAIL_CACHE_TTL_SEC:
      HUB_AIRKOREA_NUMOFROWS:
      HUB_AIRKOREA_REQUEST_TIMEOUT_SEC:
      HUB_AIRKOREA_SERVICE_KEY:
      HUB_AIR_MAX_AGE_HOURS:
      HUB_AIR_POLL_ENABLED:
      HUB_AUTH_ENFORCED:
      HUB_DURUNUBI_GPX_TIMEOUT_SEC:
      HUB_DURUNUBI_NUMOFROWS:
      HUB_DURUNUBI_RADIUS_M:
      HUB_DURUNUBI_REQUEST_TIMEOUT_SEC:
      HUB_DURUNUBI_SYNC_INTERVAL_HOURS:
      HUB_GOOGLE_MAPS_API_KEY:
      HUB_GOOGLE_PHOTOS_DAILY_MEDIA_CAP:
      HUB_GOOGLE_PHOTOS_MAX_COUNT:
      HUB_GOOGLE_PHOTOS_MAX_WIDTH_PX:
