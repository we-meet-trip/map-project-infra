      HUB_GOOGLE_PLACES_TIMEOUT_SEC:
      HUB_DATABASE_URL:
      MAP_PROJECT_HUB_ADMIN_INTERNAL_TOKEN: ${MAP_PROJECT_HUB_ADMIN_INTERNAL_TOKEN:-}
      HUB_INTERNAL_TRUSTED_CIDRS:
      MAP_PROJECT_INTERNAL_SERVICE_TOKEN:
      HUB_KAKAO_CACHE_TTL_SEC:
      HUB_KAKAO_DEFAULT_RADIUS_M:
      HUB_KAKAO_DEFAULT_SIZE:
      HUB_KAKAO_REQUEST_TIMEOUT_SEC:
      MAP_PROJECT_KAKAO_REST_API_KEY:
      HUB_KMA_NUMOFROWS:
      HUB_KMA_POLL_INTERVAL_SEC:
      HUB_KMA_RATE_LIMIT_SLEEP_SEC:
      HUB_KMA_REQUEST_TIMEOUT_SEC:
      HUB_KMA_RETRY_INTERVAL_SEC:
      HUB_KMA_RETRY_MAX_DURATION_SEC:
      MAP_PROJECT_KMA_SERVICE_KEY:
      MAP_PROJECT_LOCATION_WIRE_KEY:
      HUB_LOG_LEVEL:
      HUB_NAVER_BLOG_CACHE_TTL_SEC:
      HUB_NAVER_BLOG_DEFAULT_DISPLAY:
      HUB_NAVER_BLOG_TIMEOUT_SEC:
      MAP_PROJECT_NAVER_CLIENT_ID:
      MAP_PROJECT_NAVER_CLIENT_SECRET:
      HUB_ODSAY_API_KEY:
      HUB_ODSAY_API_KEY_FALLBACK:
      HUB_ODSAY_CACHE_COORD_DIGITS:
      HUB_ODSAY_CACHE_TTL_SEC:
      HUB_ODSAY_DAILY_CALL_CAP:
      HUB_ODSAY_FAIL_CACHE_TTL_SEC:
      HUB_ODSAY_REQUEST_TIMEOUT_SEC:
      HUB_ODSAY_TOTAL_BUDGET_SEC:
      MAP_PROJECT_OSRM_BICYCLE_BASE_URL:
      HUB_OSRM_DATA_VERSION:
      MAP_PROJECT_OSRM_FOOT_BASE_URL:
      HUB_OSRM_GRAPH_FINGERPRINT:
      HUB_OSRM_TIMEOUT_SEC:
      HUB_PLACES_STUB_MODE:
      HUB_PM_CACHE_TTL_SEC:
      HUB_PM_DEFAULT_RADIUS_M:
      HUB_PM_FAIL_CACHE_TTL_SEC:
      HUB_PM_NUMOFROWS:
      HUB_PM_PROVIDERS:
      HUB_PM_REQUEST_TIMEOUT_SEC:
      HUB_PM_SERVICE_KEY:
      HUB_PM_TOTAL_BUDGET_SEC:
      MAP_PROJECT_REDIS_DB_HUB_CACHE:
      MAP_PROJECT_REDIS_URL:
      HUB_ROUTE_CACHE_TTL_SEC:
      HUB_ROUTE_MAX_POINTS:
      HUB_SEOUL_BIKE_CACHE_TTL_SEC:
      HUB_SEOUL_BIKE_DEFAULT_RADIUS_M:
      HUB_SEOUL_BIKE_MAX_PAGES:
      HUB_SEOUL_BIKE_PAGE_SIZE:
      HUB_SEOUL_BIKE_PARTIAL_CACHE_TTL_SEC:
      HUB_SEOUL_BIKE_REQUEST_TIMEOUT_SEC:
      HUB_SEOUL_BIKE_TOTAL_BUDGET_SEC:
      HUB_SEOUL_OPENAPI_KEY:
      MAP_PROJECT_TOUR_API_SERVICE_KEY:
      HUB_TRANSIT_BUS_DOMINANCE_RATIO:
      HUB_WEATHER_NOW_CACHE_TTL_SEC:
      HUB_WEATHER_NOW_ENRICH_BUDGET_SEC:
      HUB_WEATHER_NOW_MAX_AGE_HOURS:
      HUB_WEATHER_NOW_OBSERVATION_BUDGET_SEC:
      HUB_WEATHER_SNAPSHOT_RETENTION_DAYS:
    restart: unless-stopped
    # 유휴 약 115MiB. 외부 응답을 메모리에 오래 들고 있지 않는다.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512m
    profiles: ["backend", "full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-finish:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 저장소에 처음 붙는 동안의 실패는 세지 않는다.
      start_period: 20s

  # yolo — 카메라 실시간 인식 서비스 (YOLO 추론 + Gemini Vision 식별).
  # 클라이언트가 WebSocket(/ws/vision)으로 프레임을 보내면 객체를 찾아
  # 무엇인지 설명해 돌려준다. User permit이 실패하면 인증/작업을 거절한다.
  # YOLO 가중치는 이미지 빌드 시 내장되므로 기동에 네트워크가 필요 없다.
  #
  # 프로파일을 vision 으로 분리한 이유: 이미지에 torch 가 들어가 무겁고,
  # 카메라 기능을 쓰지 않는 백엔드 개발에는 필요하지 않다.
  #   docker compose --profile vision up -d yolo
  #
  # environment 로 네 키를 덮어쓰는 이유: agent 와 GEMINI_TIMEOUT_SECONDS ·
  # JOB_TIMEOUT_SECONDS 를 같은 이름·다른 의미로 쓴다(agent 100/300초, yolo
  # 25/45초). 공유 .env 에 agent 튜닝값이 들어가면 yolo 가 그대로 물려받으므로
  # VISION_* 키로 갈라 둔다(environment 가 env_file 보다 우선한다).
  # 전체 한도가 식별 한도보다 커야 한다 — 같으면 식별을 마치고도 검색 도중
  # 잘려 이미 얻은 결과가 통째로 버려진다.
  # VISION_GEMINI_API_KEY 가 비어 있으면 공용 GEMINI_API_KEY 를 쓴다 — agent 의
  # 호출 한도 계산과 분리하려면 별도 키를 발급해 .env 에 채운다.
  #
  # ports: 호스트 8004 → 컨테이너 8000. 루프백 직결은 점검용이고,
  #        클라이언트가 실제로 쓰는 공개 경로는 proxy(8090)의 /ws/vision 이다.
  yolo:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build:
      context: ../map-project-yolo
    container_name: map-project-yolo
    <<: *default-logging
    environment:
      MAP_PROJECT_GEMINI_MODEL:
      MAP_PROJECT_KAKAO_REST_API_KEY:
      YOLO_LOG_LEVEL:
      YOLO_CONFIDENCE:
      YOLO_MODEL_PATH:
      YOLO_GEMINI_API_KEY: ${YOLO_GEMINI_API_KEY:-${MAP_PROJECT_GEMINI_API_KEY:-}}
      YOLO_WIKIPEDIA_CONTACT: ${YOLO_WIKIPEDIA_CONTACT:-}
      YOLO_GEMINI_TIMEOUT_SECONDS: ${YOLO_GEMINI_TIMEOUT_SECONDS:-25.0}
      YOLO_JOB_TIMEOUT_SECONDS: ${YOLO_JOB_TIMEOUT_SECONDS:-45.0}
      YOLO_WS_MAX_JOBS: ${YOLO_WS_MAX_JOBS:-60}
      MAP_PROJECT_VISION_INTERNAL_TOKEN: ${MAP_PROJECT_VISION_INTERNAL_TOKEN:?전용 Vision 승인 토큰이 필요하다}
      YOLO_USER_SERVICE_BASE_URL: ${YOLO_USER_SERVICE_BASE_URL:-http://user:8080}
      YOLO_PERMIT_TIMEOUT_SECONDS: ${YOLO_PERMIT_TIMEOUT_SECONDS:-5}
      YOLO_MAX_CONCURRENT_JOBS: ${YOLO_MAX_CONCURRENT_JOBS:-2}
      YOLO_WS_IDLE_TIMEOUT_SECONDS: ${YOLO_WS_IDLE_TIMEOUT_SECONDS:-120}
      YOLO_WS_MAX_MESSAGES_PER_CONNECTION: ${YOLO_WS_MAX_MESSAGES_PER_CONNECTION:-240}
    restart: unless-stopped
    # torch 와 가중치를 프로세스 안에 올린다. 다른 서비스보다 한 자리 크다.
    deploy:
      resources:
        limits:
          cpus: "2.0"  # 코어 수를 넘는 상한은 2코어 서버에서 생성이 거절된다
          memory: 3g
    profiles: ["vision"]
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # torch 를 불러오고 YOLO 모델을 올리는 데 시간이 걸려 유예를 크게 둔다.
      start_period: 30s

  # proxy — 바깥으로 열 때 앞에 세우는 유일한 관문 (nginx).
  # 설정은 ./proxy/default.conf 에 있다. 여는 경로를 목록으로 못박고(그 밖은
  # 404), 운영 지표 경로를 막고, 일정 생성에 IP 당 호출 상한을 건다.
  #
  # BFF 를 그대로 노출하지 않는 이유: BFF 는 자기 상태 점검 경로를 인증 없이
  # 열어 두고, 무거운 생성 요청에도 자체 호출 상한이 없다. 공개 주소로 그
  # 두 가지가 그대로 나가면 지표가 새고 생성 쿼터가 남용된다.
  #
  # 컨테이너 이름으로 BFF 를 찾으므로(user:8080) BFF 도 컨테이너로 떠 있어야
  # 한다. 호스트에서 BFF 를 직접 띄우는 흐름과는 같이 쓸 수 없다.
  # yolo 는 vision 프로파일이라 없을 수 있는데, default.conf 가 그 경로만
  # 요청 시점에 이름을 풀도록 짜여 있어 proxy 기동에는 영향이 없다.
  #
  # ports: 호스트 8090 → 컨테이너 80. 루프백에만 붙인다 — 바깥 노출은 이
  # 포트를 터널이 집어 가는 방식이고, 열린 포트를 그대로 두지 않는다.
  proxy:
    <<: *default-logging
    image: nginx:alpine
    container_name: map-project-proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    restart: unless-stopped
    # 유휴 약 10MiB. 레이트리밋 존 세 개가 각각 10m 를 차지한다.
    profiles: ["backend", "full"]
    depends_on:
      - user
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 상류를 잠시 갈아 끼우는 자리. 배포 중에만 파일이 생기고, 끝나면
      # 비워진다. 서버에서는 checkout 밖의 상태 디렉터리를 가리켜, 소스를
      # 되감아도 이 자리가 함께 되감기지 않게 한다.
      - ${MAP_PROJECT_PROXY_UPSTREAMS_DIR:-./proxy/upstreams}:/etc/nginx/upstreams:ro
    ports:
      - "127.0.0.1:8090:80"
    # 127.0.0.1 을 직접 쓴다. localhost 는 IPv6 로 풀릴 수 있는데 nginx 는
    # IPv4 로만 듣고 있어 점검이 통과하지 못한다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

# volumes — 호스트와 분리된 영속 스토리지.
# postgres-data: RDB 데이터 디렉터리 (/var/lib/postgresql/data)
# redis-data:    redis appendonly 디렉터리 (/data)
# osrm-data:     osrm-rebuild.sh 로 만든 /foot·/bicycle/korea.osrm* 를 넣어 두는 자리.
#
# 실제 이름은 compose 기본 규칙(<프로젝트명>_<볼륨>, 예: map-project_postgres-data)을
# 따른다. 이름을 따로 못박지 않아야 시험 스택처럼 프로젝트명을 바꿔 띄웠을 때
# 다른 스택의 데이터 볼륨에 붙지 않는다. 지울 때는 docker compose down -v 로 함께
# 지워진다.
volumes:
  postgres-data:
  redis-data:
  osrm-data:
  # DB 준비 단계끼리 "이번에 user 부트스트랩을 새로 열었다" 는 사실만 주고받는 자리.
  db-setup-state:

# networks — 두 스택이 공유하는 브리지 네트워크. 이 파일이 소유자다.
# 서비스 간 통신은 컨테이너 이름이 아니라 서비스 이름(postgres, redis, hub …)으로
# DNS 해석된다 — container_name 을 고정해도 이 이름은 그대로다.
networks:
  default:
    name: map-net
