      USER_HUB_DIRECTIONS_TIMEOUT_SECONDS: ${USER_HUB_DIRECTIONS_TIMEOUT_SECONDS:-20}
      MAP_PROJECT_INTERNAL_SERVICE_TOKEN:
      MAP_PROJECT_USER_ADMIN_INTERNAL_TOKEN: ${MAP_PROJECT_USER_ADMIN_INTERNAL_TOKEN:-}
      USER_JWT_ACCESS_TTL:
      USER_JWT_PRIVATE_KEY:
      USER_JWT_PUBLIC_KEY:
      USER_JWT_REFRESH_TTL:
      USER_APP_ENV:
      USER_KAKAO_APP_ID:
