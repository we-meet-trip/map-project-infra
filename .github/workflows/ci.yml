# 오프라인 검사만 한다. 비밀값·외부 키·배포 권한을 쓰지 않는다.
#
# - 단위 시험: 표준 라이브러리만 쓰므로 여러 파이썬 판에서 돌린다.
# - compose: 빠른 시작과 같은 생성기로 만든 환경파일로 조합마다 렌더한다. 덧칠이
#   요구하는 값이 환경파일에 없다는 사실은 렌더에서 먼저 드러나야 한다.
# - 관문 설정: compose 렌더는 nginx 문법을 보지 않으므로 nginx -t 로 따로 본다.
# - 격리: 시험 스택이 기본 스택과 볼륨·포트·이름을 나눠 쓰지 않는지 기계가 본다.
#   겹치면 시험 스택이 다른 스택의 데이터베이스를 물고 올라온다.
# - 본보기: .env.example 의 비밀값 자리는 비어 있어야 한다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: |
          for f in scripts/*.sh db/setup/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # 스타일 지적으로 막지는 않는다. 실행을 깨뜨릴 수준만 본다.
          shellcheck -S error scripts/*.sh db/setup/*.sh

      - name: prepare env
        run: |
          ./scripts/make-local-env.sh --force
          ./scripts/make-test-env.sh --force

      - name: compose render
        run: |
          docker compose --env-file ./.env -f docker-compose.yml --profile '*' config -q
          docker compose --env-file ./.env -f docker-compose.admin.yml --profile '*' config -q
          MAP_PROJECT_IMAGE_REGISTRY=registry.example/acme MAP_PROJECT_IMAGE_TAG=check \
            docker compose --env-file ./.env \
              -f docker-compose.yml -f docker-compose.registry.yml \
              --profile full --profile routing config -q
          MAP_PROJECT_EDGE_DOMAIN=example.invalid MAP_PROJECT_EDGE_EMAIL=ci@example.invalid \
            docker compose --env-file ./.env \
              -f docker-compose.yml -f docker-compose.edge.yml \
              --profile full --profile edge config -q

      - name: proxy configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstreams"
          python3 - <<'PY' > "$RUNNER_TEMP/upstreams/hub.conf"
          import importlib.util
          spec = importlib.util.spec_from_file_location('roll', 'scripts/service-rollover.py')
          roll = importlib.util.module_from_spec(spec); spec.loader.exec_module(roll)
          print(roll.upstream_body('hub', 'map-test-hub-rollover'), end='')
          PY
          for dir in "$PWD/proxy/upstreams" "$RUNNER_TEMP/upstreams"; do
            docker run --rm \
              -v "$PWD/proxy/default.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$dir:/etc/nginx/upstreams:ro" \
              nginx:alpine nginx -t
          done

      - name: stack isolation
        run: ./scripts/compose-isolation-check.sh

      - name: example keeps secrets empty
        run: |
          # 비밀값 이름이거나, 접속 문자열 안에 비밀번호가 든 줄
          bad=$( { grep -nE '^[A-Z_]*(KEY|KEYS|SECRET|TOKEN|PASSWORD|DSN)=.+' .env.example
                   grep -nE '^[A-Z_]*(URL|DSN)=.*://[^:/@]+:[^@]+@' .env.example; } || true)
          if [ -n "$bad" ]; then
            echo "비밀값 자리에 값이 있다(.env.example 은 빈 값만 둔다):"
            echo "$bad" | cut -d= -f1
            exit 1
          fi
